name: recruitment-clean-v3-parallel
services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: recruitment
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin
    secrets:
    - db_admin
    volumes:
    - pgdata:/var/lib/postgresql/data
    networks:
    - database
    mem_limit: 1g
    cpus: 1.0
    shm_size: 256m
    stop_grace_period: 60s
    logging: &id001
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d recruitment
      interval: 5s
      timeout: 3s
      retries: 20
    platform: ${TARGET_PLATFORM:-linux/amd64}
  init-config:
    image: recruitment-clean-app:v3-parallel
    build:
      context: .
      target: app
    user: 0:0
    entrypoint:
    - python
    - docker/seed_config.py
    restart: 'no'
    network_mode: none
    read_only: true
    volumes:
    - hhconfig:/config
    secrets:
    - hh_seed
    security_opt:
    - no-new-privileges:true
    logging: *id001
    platform: ${TARGET_PLATFORM:-linux/amd64}
  browser:
    image: recruitment-clean-browser:v3-parallel
    build:
      context: .
      dockerfile: browser_service/Dockerfile
    init: true
    restart: unless-stopped
    user: 1000:1000
    read_only: true
    tmpfs:
    - /tmp:size=512m,mode=1777
    environment:
      BROWSER_HEADLESS: 'true'
      BROWSER_BIND_HOST: 0.0.0.0
    secrets:
    - browser_key
    networks:
    - browsernet
    - egress
    security_opt:
    - no-new-privileges:true
    - seccomp=./docker/browser-seccomp.json
    cap_drop:
    - ALL
    shm_size: 512m
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 30s
    logging: *id001
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 30s
    platform: ${TARGET_PLATFORM:-linux/amd64}
  web:
    image: recruitment-clean-app:v3-parallel
    build:
      context: .
      target: app
    init: true
    restart: unless-stopped
    user: 10001:10001
    read_only: true
    tmpfs:
    - /tmp:size=128m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - web
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: '8765'
      APP_ENV_FILE: /config/hh.env
      APP_RUNTIME_ENV_FILE: ''
      LOG_TO_FILE: 'false'
      LOG_DIR: /tmp/logs
      DB_POOL_MAX: '24'
      BROWSER_MAX_SESSIONS: '8'
      GENERAL_CONSUMERS: '16'
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    secrets:
    - db_app
    - browser_key
    - metrics_token
    - gmail_password
    volumes:
    - hhconfig:/config
    networks:
    - database
    - browsernet
    - egress
    depends_on:
      db:
        condition: service_healthy
      init-config:
        condition: service_completed_successfully
      browser:
        condition: service_healthy
    ports:
    - ${APP_BIND_IP:-127.0.0.1}:${APP_PUBLIC_PORT:-8765}:8765
    healthcheck:
      test:
      - CMD
      - python
      - docker/healthcheck.py
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 60s
    platform: ${TARGET_PLATFORM:-linux/amd64}
  worker-general:
    image: recruitment-clean-app:v3-parallel
    build:
      context: .
      target: app
    init: true
    restart: unless-stopped
    user: 10001:10001
    read_only: true
    tmpfs:
    - /tmp:size=128m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - general
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: '8765'
      APP_ENV_FILE: /config/hh.env
      APP_RUNTIME_ENV_FILE: ''
      LOG_TO_FILE: 'false'
      LOG_DIR: /tmp/logs
      DB_POOL_MAX: '24'
      BROWSER_MAX_SESSIONS: '8'
      GENERAL_CONSUMERS: '16'
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    secrets:
    - db_app
    - browser_key
    - metrics_token
    - gmail_password
    volumes:
    - hhconfig:/config
    networks:
    - database
    - browsernet
    - egress
    depends_on:
      db:
        condition: service_healthy
      init-config:
        condition: service_completed_successfully
      browser:
        condition: service_healthy
    platform: ${TARGET_PLATFORM:-linux/amd64}
  worker-browser:
    image: recruitment-clean-app:v3-parallel
    build:
      context: .
      target: app
    init: true
    restart: unless-stopped
    user: 10001:10001
    read_only: true
    tmpfs:
    - /tmp:size=128m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - browser
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: '8765'
      APP_ENV_FILE: /config/hh.env
      APP_RUNTIME_ENV_FILE: ''
      LOG_TO_FILE: 'false'
      LOG_DIR: /tmp/logs
      DB_POOL_MAX: '16'
      BROWSER_MAX_SESSIONS: '8'
      XRAY_CONSUMERS: '8'
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    secrets:
    - db_app
    - browser_key
    - metrics_token
    - gmail_password
    volumes:
    - hhconfig:/config
    networks:
    - database
    - browsernet
    - egress
    depends_on:
      db:
        condition: service_healthy
      init-config:
        condition: service_completed_successfully
      browser:
        condition: service_healthy
    platform: ${TARGET_PLATFORM:-linux/amd64}
  bootstrap:
    image: recruitment-clean-app:v3-parallel
    build:
      context: .
      target: app
    init: true
    restart: 'no'
    user: 10001:10001
    read_only: true
    tmpfs:
    - /tmp:size=128m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - bootstrap
    profiles:
    - admin
    secrets:
    - db_admin
    - db_app
    - db_backup
    networks:
    - database
    depends_on:
      db:
        condition: service_healthy
    platform: ${TARGET_PLATFORM:-linux/amd64}
  backup:
    image: recruitment-clean-maintenance:v3-parallel
    build:
      context: .
      target: maintenance
    init: true
    restart: unless-stopped
    user: 10001:10001
    read_only: true
    tmpfs:
    - /tmp:size=128m,mode=1777
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    command:
    - backup-loop
    profiles:
    - maintenance
    secrets:
    - db_admin
    - db_backup
    volumes:
    - ./deploy/backups:/backups
    networks:
    - database
    depends_on:
      db:
        condition: service_healthy
      init-backups:
        condition: service_completed_successfully
    platform: ${TARGET_PLATFORM:-linux/amd64}
  init-backups:
    image: recruitment-clean-app:v3-parallel
    user: 0:0
    entrypoint:
    - python
    - -c
    - import os; os.chown('/backups',10001,10001); os.chmod('/backups',0o700)
    restart: 'no'
    profiles:
    - maintenance
    network_mode: none
    read_only: true
    volumes:
    - ./deploy/backups:/backups
    security_opt:
    - no-new-privileges:true
    platform: ${TARGET_PLATFORM:-linux/amd64}
secrets:
  db_admin:
    file: ./deploy/secrets/db_admin
  db_app:
    file: ./deploy/secrets/db_app
  db_backup:
    file: ./deploy/secrets/db_backup
  browser_key:
    file: ./deploy/secrets/browser_key
  metrics_token:
    file: ./deploy/secrets/metrics_token
  gmail_password:
    file: ./deploy/secrets/gmail_password
  hh_seed:
    file: ./deploy/secrets/hh_seed
volumes:
  pgdata: {}
  hhconfig: {}
networks:
  database:
    internal: true
  browsernet:
    internal: true
  egress: {}

